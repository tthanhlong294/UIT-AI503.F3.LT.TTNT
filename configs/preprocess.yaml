# Cấu hình tiền xử lý ảnh khuôn mặt (Phase 1 bước 1.9)
# Căn chỉnh khuôn mặt về kích thước chuẩn trước khi trích xuất đặc trưng.

# Kích thước ảnh sau căn chỉnh — phải khớp đầu vào của mô hình nhận diện.
# mobilefacenet.onnx nhận [1, 3, 112, 112], xem models/README.md bảng A dòng A4.
output_size: [112, 112]

# --- Điểm chuẩn 5 mốc ---
# Toạ độ (x, y) mà năm điểm mốc khuôn mặt phải được đưa về, theo thứ tự:
#   1. mắt trái   2. mắt phải   3. mũi   4. khoé miệng trái   5. khoé miệng phải
#
# ⚠️ BỘ SỐ NÀY PHẢI KHỚP VỚI CÁCH MÔ HÌNH NHẬN DIỆN ĐƯỢC HUẤN LUYỆN.
# Đây là bộ điểm chuẩn của họ ArcFace/InsightFace cho ảnh 112×112 — cùng họ với
# mobilefacenet.onnx đang dùng. Dùng bộ điểm khác sẽ cho ảnh trông vẫn "đúng mặt"
# nhưng embedding lệch hệ thống, và không có dấu hiệu nào báo sai.
#
# Nếu đổi mô hình nhận diện: kiểm lại bộ điểm này trước, đừng giả định.
reference_landmarks:
  - [38.2946, 51.6963] # mắt trái
  - [73.5318, 51.5014] # mắt phải
  - [56.0252, 71.7366] # mũi
  - [41.5493, 92.3655] # khoé miệng trái
  - [70.7299, 92.2041] # khoé miệng phải

# Nguồn bộ điểm chuẩn — ghi để truy vết được, và để nêu trong báo cáo
reference_source: "InsightFace ArcFace 112x112 canonical 5-point template"

# --- Nội suy khi biến đổi ảnh ---
# Dùng nội suy song tuyến tính. Không dùng nearest (răng cưa) vì kết cấu bề mặt
# là tín hiệu mà khối chống giả mạo dựa vào.
interpolation: bilinear

# Giá trị điền cho vùng nằm ngoài ảnh gốc sau khi biến đổi (BGR)
border_value: [0, 0, 0]

# --- Lọc chất lượng trước khi căn chỉnh (bước 1.9, chuẩn bị cho 1.10) ---
#
# ⚠️ Vì sao cần: `align.py` KHÔNG tự phát hiện điểm mốc rác. Đưa cho nó 5 điểm bậy,
# nó vẫn căn chỉnh trơn tru và trả về một ảnh 112×112 trông hợp lệ, không báo gì cả.
# Ảnh rác đó sẽ lặng lẽ vào `data/processed/` rồi thành embedding sai ở Phase 3.
# Đã kiểm 18/08/2026: 5 điểm mốc thẳng hàng phân biệt KHÔNG làm `align.py` báo lỗi —
# và đúng về mặt toán, vì biến đổi tương tự chỉ cần 2 điểm phân biệt là xác định được.
loc_chat_luong:
  # Cạnh nhỏ nhất của khung bao khuôn mặt, tính bằng pixel trên ảnh GỐC.
  # Mặt nhỏ hơn mức này thì điểm mốc không đủ tin cậy để căn chỉnh.
  # LFW là ảnh 250×250 với mặt chiếm phần lớn khung, nên ngưỡng này chủ yếu lọc
  # ảnh có người ở hậu cảnh.
  min_bbox_px: 40

  # Ngưỡng tin cậy riêng cho khâu tiền xử lý, ĐỘC LẬP với `detect.yaml`.
  # Đặt cao hơn ngưỡng chạy thời gian thực: khi xây cơ sở dữ liệu thì thà bỏ sót
  # còn hơn nhận nhầm, vì một ảnh bẩn làm hỏng embedding của cả danh tính.
  min_confidence: 0.7

  # Kiểm bất biến hình học của 5 điểm mốc trước khi căn chỉnh.
  # Bốn bất biến đã kiểm ngày 18/08/2026 trên 60 ảnh LFW ngẫu nhiên, đúng 60/60:
  #   1. mắt trái có x nhỏ hơn mắt phải
  #   2. hai mắt nằm trên mũi
  #   3. mũi nằm trên miệng
  #   4. khoé miệng trái có x nhỏ hơn khoé miệng phải
  # Vi phạm bất kỳ điều nào ⇒ điểm mốc bất thường ⇒ bỏ qua ảnh, ghi lý do vào manifest.
  kiem_hinh_hoc_diem_moc: true

  # Phép kiểm thứ NĂM — bốn bất biến trên là ĐIỀU KIỆN CẦN nhưng KHÔNG ĐỦ.
  #
  # Kiểm 19/08/2026: bộ điểm thẳng hàng theo đường chéo [[0,0],[1,1],[2,2],[3,3],[4,4]]
  # thoả CẢ BỐN bất biến — mắt trái vẫn bên trái mắt phải, mắt vẫn "trên" mũi, v.v.
  # Mà đó chính là trường hợp `align.py` cũng không bắt được. Nếu chỉ có bốn bất biến
  # thì điểm mốc rác vẫn lọt qua cả hai lớp bảo vệ.
  #
  # Đại lượng phân tách: khoảng cách vuông góc từ MŨI tới đường nối HAI MẮT,
  # chia cho khoảng cách giữa hai mắt. Với khuôn mặt thật thì mũi nằm hẳn ra khỏi
  # đường nối hai mắt; với điểm mốc suy biến thì tỉ số này tiến về 0.
  #   · mẫu chuẩn ArcFace (khuôn mặt chính diện) : 0,5715
  #   · điểm mốc thẳng hàng                       : 0,0000
  #
  # ⚠️ Ngưỡng 0,15 là mức TẠM, chọn rất rộng (khoảng 1/4 giá trị mặt chính diện) để chỉ
  # bắt trường hợp gần suy biến, không loại nhầm mặt nghiêng. Đây là phép kiểm TỈNH TÁO,
  # không phải ngưỡng chất lượng. Khi có dữ liệu thật ở bước 1.10, đo phân bố tỉ số này
  # trên toàn tập rồi chốt lại theo số đo (R7, R16) — đừng giữ số này chỉ vì nó có sẵn.
  min_ti_le_lech_mui: 0.15
