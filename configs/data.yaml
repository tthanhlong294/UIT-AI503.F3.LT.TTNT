# Cấu hình thu thập và tổ chức dữ liệu khuôn mặt
# Quy ước đầy đủ: docs/quy-uoc-du-lieu.md
# Mọi tham số ở đây — không hardcode trong scripts/ (R16).

# --- Điều kiện chụp ---
# Năm tư thế × hai mức sáng = 10 tổ hợp
poses: [frontal, left, right, up, down]
lights: [bright, dim]

# --- Chỉ tiêu số lượng ---
# 10 tổ hợp × 10 ảnh = 100 ảnh/người, đúng chỉ tiêu tối thiểu của đề cương
min_per_combo: 10
min_per_user: 100

# --- Định danh hợp lệ ---
# u = gallery (được đăng ký) · x = impostor in-domain (KHÔNG BAO GIỜ đăng ký)
id_pattern: "^[ux][0-9]{2}$"

# --- Đầu ra ---
out_dir_gallery: data/raw
out_dir_indomain: data/impostor/indomain
out_dir_spoof: data/spoof
manifest_name: manifest.csv

# PNG bắt buộc — nén JPEG làm sai lệch phép đo độ nét và nhiễu ở bước 1.7,
# đồng thời che dấu vết tấn công của bộ dữ liệu spoof. Xem quy ước §6.
image_format: png

# --- Nhịp chụp ---
# Giây chờ giữa hai ảnh liên tiếp, đủ để người chụp giữ nguyên tư thế
capture_interval_s: 0.5
# Giây chờ khi chuyển sang tư thế mới, đủ để đọc hướng dẫn và đổi tư thế
pose_switch_delay_s: 3.0

# --- Bộ dữ liệu đối chứng LFW (Phase 1 bước 1.5) ---
# Dùng làm tập impostor quy mô lớn để đo FAR. Xem docs/quy-uoc-du-lieu.md §4.
lfw:
  # Bản GỐC, chưa căn chỉnh — KHÔNG dùng bản funneled/deep-funneled.
  # Lý do: đồ án áp dụng cùng một quy trình detect → crop → align cho cả bốn nguồn
  # dữ liệu. Bản đã căn chỉnh sẵn bằng phương pháp khác sẽ tạo ra khác biệt miền
  # mà ta không kiểm soát được, làm hỏng phép kiểm chứng domain adaptation ở Phase 3.
  #
  # ⚠️ Máy chủ gốc `vis-www.cs.umass.edu` ĐÃ NGỪNG HOẠT ĐỘNG (kiểm 17/08/2026:
  # DNS công cộng trả về NXDOMAIN, không còn bản ghi tên miền). Địa chỉ dưới đây là
  # mirror chính thức trên figshare mà scikit-learn dùng cho `fetch_lfw_people`
  # (xem `sklearn/datasets/_lfw.py`, hằng số `ARCHIVE`) — vẫn đúng **bản gốc**
  # `lfw.tgz`, không phải bản funneled. Đã kiểm ngày 17/08/2026: HTTP 200,
  # 180 566 744 byte, chuyển hướng sang S3, magic byte `1f 8b` đúng định dạng gzip.
  url: "https://ndownloader.figshare.com/files/5976018"
  archive_name: lfw.tgz

  # Mã băm SHA256 của lfw.tgz gốc, lấy từ scikit-learn. Dùng để chứng minh mirror
  # figshare cho ra ĐÚNG tệp mà máy chủ UMass từng phát hành:
  #   python scripts/download_lfw.py --expect-sha256 055f7d9c632d7370e6fb4afc7468d40f970c34a80d4c6f50ffec63f5a8d536c0
  # Nên chạy kèm cờ này ít nhất một lần và ghi kết quả vào nhật ký tuần.
  expected_sha256: "055f7d9c632d7370e6fb4afc7468d40f970c34a80d4c6f50ffec63f5a8d536c0"
  cache_dir: data/.cache
  out_dir: data/impostor/lfw_original

  # --- Chọn danh tính ---
  #
  # Đề cương đặt mức tối thiểu ≥ 100 danh tính. Lấy đúng 100 thì KHÔNG ĐỦ để chốt
  # ngưỡng theo bước 3.7c (`FAR_adapt ≤ 1 %`). Tính toán ngày 17/08/2026:
  #
  #   100 danh tính  ->   384 ảnh -> nửa test  192 phép thử -> cận trên FAR 1,56 %
  #  1680 danh tính  -> 9 164 ảnh -> nửa test 4582 phép thử -> cận trên FAR 0,07 %
  #
  # (Quy tắc số 3: 0 lần nhận nhầm trên n phép thử ⇒ cận trên khoảng tin cậy 95 %
  # của FAR ≈ 3/n. Bước 1.11 chia đôi val/test không trùng danh tính, nên chỉ một
  # nửa được dùng để báo cáo con số cuối.)
  #
  # 1680 là TOÀN BỘ số danh tính LFW có ≥ 2 ảnh (trên tổng 5749 danh tính / 13233 ảnh).
  # Dùng hết phần khả dụng vừa cho sức phân giải tốt nhất, vừa dễ bảo vệ trước hội đồng
  # hơn một con số chọn tuỳ ý. Tập impostor không bao giờ được đăng ký vào gallery nên
  # tăng số danh tính không đánh đổi gì về phương pháp — chỉ thêm phép thử.
  #
  # Chi phí: ~124 MB đĩa (data/ đã gitignore) và một lần tiền xử lý dài hơn ở bước 1.9.
  min_identities: 1680
  min_images_per_identity: 2 # đủ ảnh để chia val/test và có nhiều lần so khớp
  # Seed vẫn giữ để tái lập (R15). Lưu ý: khi min_identities bằng đúng số danh tính
  # khả dụng thì phép chọn lấy trọn, seed không còn ảnh hưởng tới TẬP được chọn.
  seed: 42

  # Trích dẫn bắt buộc trong báo cáo (R28c)
  citation: "Huang, G.B., Ramesh, M., Berg, T., Learned-Miller, E. — Labeled Faces in the Wild: A Database for Studying Face Recognition in Unconstrained Environments, University of Massachusetts Amherst, Technical Report 07-49, 2007"
  # Trang chủ gốc đã ngừng hoạt động cùng máy chủ vis-www; giữ lại để ghi nguồn lịch sử.
  homepage_goc: "http://vis-www.cs.umass.edu/lfw/ (không còn truy cập được từ 2026)"
  homepage: "https://ndownloader.figshare.com/files/5976018"
