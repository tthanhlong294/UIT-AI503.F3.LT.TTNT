services:
  faceid-dev:
    # Toàn dự án dùng đúng MỘT image (CLAUDE.md R43, §3.1). Dòng `image` bên dưới bắt buộc phải có:
    # thiếu nó thì compose tự đặt tên riêng dạng <thư mục>-faceid-dev và sinh ra image thứ hai.
    image: faceid:arm64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.arm64
    platform: linux/arm64
    volumes:
      - ..:/app
    working_dir: /app
    command: sleep infinity
    # Phần camera sẽ bổ sung khi triển khai lên Pi 5 thật (không ánh xạ được camera trên máy phát triển Windows)
